server {
    listen 80;
    server_name _;   # gelen her hostname'i kabul et

    # Genel proxy ayarları
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://config-manager:5050;

        # Session cookie'sinin kaybolmaması için
        proxy_cookie_path /config-machines /config-machines;
        proxy_set_header  Cookie $http_cookie;

        # SSE (canlı log akışı) için: buffering kapatılmalı
        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       3600s;  # log bağlantısı 1 saat açık kalabilir
        proxy_send_timeout       3600s;
        proxy_connect_timeout    10s;

        # SSE header'ları
        proxy_set_header Connection '';
        proxy_http_version       1.1;
        chunked_transfer_encoding on;
    }
}
