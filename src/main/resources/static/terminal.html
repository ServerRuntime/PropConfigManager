<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><text x='4' y='22' font-family='monospace' font-size='16' fill='%233fb950'>%3E_</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0d1117;
      --topbar: #161b22;
      --border: #30363d;
      --text:   #e6edf3;
      --muted:  #8b949e;
      --green:  #3fb950;
      --red:    #f85149;
      --yellow: #d29922;
      --blue:   #58a6ff;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

    /* ── Top bar ── */
    #topbar {
      display: flex; align-items: center; gap: 8px;
      height: 46px; padding: 0 14px;
      background: var(--topbar);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink:0; }
    .dot-red    { background: #ff5f57; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green  { background: #28c840; }

    #machine-title {
      margin-left: 6px; font-size: 13px; font-weight: 600;
      color: var(--text); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 220px;
    }

    /* ── Toolbar ── */
    .tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex-shrink:0; }

    .tb-btn {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 0 10px; height: 28px; min-width: 28px;
      background: transparent; border: 1px solid transparent;
      border-radius: 6px; color: var(--muted); font-size: 12px;
      cursor: pointer; transition: all .15s; white-space: nowrap;
      font-family: inherit;
    }
    .tb-btn:hover { background: rgba(255,255,255,.06); border-color: var(--border); color: var(--text); }
    .tb-btn.active { background: rgba(88,166,255,.12); border-color: rgba(88,166,255,.3); color: var(--blue); }
    .tb-btn i { font-size: 11px; }

    #font-size-display {
      font-size: 11px; color: var(--muted); min-width: 22px; text-align: center;
    }

    /* ── Status area ── */
    #status-area { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink:0; }

    #status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); }
    #status-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #status-dot.error     { background: var(--red); }

    #status-label { font-size: 11px; color: var(--muted); }

    #reconnect-btn {
      padding: 3px 10px; font-size: 11px; background: transparent;
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); cursor: pointer; display: none; font-family: inherit;
    }
    #reconnect-btn:hover { background: var(--border); }

    /* ── Search bar ── */
    #search-bar {
      display: none; align-items: center; gap: 6px;
      padding: 6px 14px; background: var(--topbar);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #search-bar.open { display: flex; }
    #search-input {
      flex: 1; max-width: 280px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 13px; padding: 4px 10px; outline: none;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }
    #search-input:focus { border-color: var(--blue); }
    #search-count { font-size: 11px; color: var(--muted); min-width: 60px; }

    /* ── Layout ── */
    #layout { display: flex; flex-direction: column; height: 100vh; }

    #terminal-container { flex: 1; overflow: hidden; padding: 4px; background: #000; }

    .xterm { height: 100% !important; }
    .xterm-viewport { overflow-y: hidden !important; }

    /* ── Login overlay ── */
    #login-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    #login-box {
      background: var(--topbar); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px; width: 340px;
    }
    #login-box h2 { font-size: 16px; font-weight: 700; margin-bottom: 20px; color: var(--text); }
    #login-box label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    #login-box input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 14px;
      padding: 8px 10px; margin-bottom: 14px; outline: none;
    }
    #login-box input:focus { border-color: var(--blue); }
    #login-btn {
      width: 100%; padding: 9px; background: var(--blue); color: #000;
      font-weight: 700; font-size: 14px; border: none; border-radius: 6px; cursor: pointer;
    }
    #login-btn:hover { opacity: .9; }
    #login-error { margin-top: 12px; font-size: 12px; color: var(--red); display: none; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px);
      background: #2a2a3a; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 18px; font-size: 12px; color: var(--text);
      transition: transform .25s; z-index: 200; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- Login overlay -->
<div id="login-overlay" style="display:none">
  <div id="login-box">
    <h2>🔐 SSH Kimlik Bilgileri</h2>
    <label>Kullanıcı adı</label>
    <input id="inp-user" type="text" placeholder="root" autocomplete="username">
    <label>Parola</label>
    <input id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button id="login-btn" onclick="doLogin()">Bağlan</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="layout">
  <!-- ── Top bar ── -->
  <div id="topbar">
    <div class="dot dot-red"></div>
    <div class="dot dot-yellow"></div>
    <div class="dot dot-green"></div>
    <span id="machine-title">Terminal</span>

    <div class="tb-sep"></div>

    <!-- Clear -->
    <button class="tb-btn" onclick="clearTerminal()" title="Ekranı temizle (Ctrl+L)">
      <i class="fas fa-eraser"></i> Temizle
    </button>

    <div class="tb-sep"></div>

    <!-- Font boyutu -->
    <button class="tb-btn" onclick="changeFontSize(-1)" title="Yazı küçült">
      <i class="fas fa-minus"></i>
    </button>
    <span id="font-size-display">14</span>
    <button class="tb-btn" onclick="changeFontSize(+1)" title="Yazı büyüt">
      <i class="fas fa-plus"></i>
    </button>

    <div class="tb-sep"></div>

    <!-- Ara -->
    <button class="tb-btn" id="btnSearch" onclick="toggleSearch()" title="Ara (Ctrl+F)">
      <i class="fas fa-search"></i> Ara
    </button>

    <!-- Kopyala -->
    <button class="tb-btn" onclick="copySelection()" title="Seçimi kopyala">
      <i class="fas fa-copy"></i> Kopyala
    </button>

    <!-- Tam ekran -->
    <button class="tb-btn" id="btnFullscreen" onclick="toggleFullscreen()" title="Tam ekran (F11)">
      <i class="fas fa-expand"></i>
    </button>

    <!-- Status -->
    <div id="status-area">
      <div id="status-dot"></div>
      <span id="status-label">Bağlanıyor…</span>
      <button id="reconnect-btn" onclick="reconnect()">↺ Yeniden Bağlan</button>
    </div>
  </div>

  <!-- ── Search bar ── -->
  <div id="search-bar">
    <i class="fas fa-search" style="color:var(--muted);font-size:12px"></i>
    <input id="search-input" placeholder="Ara…" oninput="doSearch()" onkeydown="searchKeydown(event)">
    <span id="search-count"></span>
    <button class="tb-btn" onclick="searchPrev()" title="Önceki"><i class="fas fa-chevron-up"></i></button>
    <button class="tb-btn" onclick="searchNext()" title="Sonraki"><i class="fas fa-chevron-down"></i></button>
    <button class="tb-btn" onclick="toggleSearch()" title="Kapat"><i class="fas fa-times"></i></button>
  </div>

  <div id="terminal-container"></div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-search@0.13.0/lib/xterm-addon-search.min.js"></script>
<script>
// ── URL parametreleri ──────────────────────────────────────────────────────
const params      = new URLSearchParams(location.search);
const machineId   = params.get('machineId') || '';
const machineName = params.get('name')      || machineId;
const hasCreds    = params.get('hasCreds')  === 'true';

document.title = machineName + ' — Terminal';
document.getElementById('machine-title').textContent = '⌨  ' + machineName;

// ── xterm.js kurulum ──────────────────────────────────────────────────────
let fontSize = 14;

const term = new Terminal({
  fontFamily: '"Cascadia Code", "Fira Code", "Consolas", monospace',
  fontSize,
  lineHeight: 1.2,
  cursorBlink: true,
  cursorStyle: 'block',
  theme: {
    background:    '#000000',
    foreground:    '#e6edf3',
    cursor:        '#e6edf3',
    black:         '#0d1117',
    red:           '#ff7b72',
    green:         '#3fb950',
    yellow:        '#d29922',
    blue:          '#58a6ff',
    magenta:       '#bc8cff',
    cyan:          '#39c5cf',
    white:         '#b1bac4',
    brightBlack:   '#6e7681',
    brightRed:     '#ffa198',
    brightGreen:   '#56d364',
    brightYellow:  '#e3b341',
    brightBlue:    '#79c0ff',
    brightMagenta: '#d2a8ff',
    brightCyan:    '#56d4dd',
    brightWhite:   '#f0f6fc',
  },
  allowProposedApi: true,
  scrollback: 5000,
});

const fitAddon    = new FitAddon.FitAddon();
const searchAddon = new SearchAddon.SearchAddon();
term.loadAddon(fitAddon);
term.loadAddon(searchAddon);
term.open(document.getElementById('terminal-container'));
fitAddon.fit();

// ── Boyut değişince PTY'yi güncelle ───────────────────────────────────────
const resizeObserver = new ResizeObserver(() => {
  fitAddon.fit();
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
});
resizeObserver.observe(document.getElementById('terminal-container'));

// ── WebSocket ─────────────────────────────────────────────────────────────
let ws = null;

function setStatus(state, text) {
  document.getElementById('status-dot').className   = state;
  document.getElementById('status-label').textContent = text;
  document.getElementById('reconnect-btn').style.display = state === 'error' ? 'inline-block' : 'none';
}

function connect(username, password) {
  const proto    = location.protocol === 'https:' ? 'wss' : 'ws';
  const basePath = location.pathname.replace(/\/[^\/]*$/, '');
  ws = new WebSocket(`${proto}://${location.host}${basePath}/ws/terminal`);

  ws.onopen = () => {
    setStatus('', 'Kimlik doğrulanıyor…');
    ws.send(JSON.stringify({
      type: 'connect', machineId,
      username: username || undefined,
      password: password || undefined,
      cols: term.cols, rows: term.rows,
    }));
  };

  ws.onmessage = (evt) => {
    const data = evt.data;
    if (data.charAt(0) === '{') {
      try {
        const msg = JSON.parse(data);
        if (msg.type === 'connected') { setStatus('connected', 'Bağlı — ' + msg.host); return; }
        if (msg.type === 'error')     { setStatus('error', msg.message); term.writeln('\r\n\x1b[31m✖ ' + msg.message + '\x1b[0m\r\n'); showLoginError(msg.message); return; }
      } catch (e) {}
    }
    term.write(data);
  };

  ws.onerror = () => setStatus('error', 'WebSocket hatası');

  ws.addEventListener('close', (e) => {
    if (e.code === 1006 || e.code === 4401) {
      term.writeln('\r\n\x1b[31m✖ Oturum açılmamış. Ana sayfaya yönlendiriliyorsunuz…\x1b[0m');
      setTimeout(() => { location.href = '/'; }, 1500);
    }
  }, { once: true });

  ws.onclose = (e) => {
    if (e.code !== 1000) {
      setStatus('error', 'Bağlantı kesildi');
      term.writeln('\r\n\x1b[33m⚠ Bağlantı kapandı.\x1b[0m');
    }
  };

  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(data);
  });
}

function reconnect() {
  if (ws) { try { ws.close(); } catch(e) {} ws = null; }
  term.clear();
  hasCreds ? connect() : showLogin();
}

// ── Araç çubuğu fonksiyonları ─────────────────────────────────────────────

// Clear
function clearTerminal() {
  term.clear();
  // SSH'a da clear gönder (prompt'u yenile)
  if (ws && ws.readyState === WebSocket.OPEN) ws.send('\x0c');
}

// Font boyutu
function changeFontSize(delta) {
  fontSize = Math.min(24, Math.max(8, fontSize + delta));
  term.options.fontSize = fontSize;
  document.getElementById('font-size-display').textContent = fontSize;
  fitAddon.fit();
}

// Kopyala
function copySelection() {
  const sel = term.getSelection();
  if (!sel) { showToast('Önce metin seçin'); return; }
  navigator.clipboard.writeText(sel).then(() => showToast('Kopyalandı ✓'));
}

// Tam ekran
function toggleFullscreen() {
  const btn = document.getElementById('btnFullscreen');
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
    btn.innerHTML = '<i class="fas fa-compress"></i>';
  } else {
    document.exitFullscreen();
    btn.innerHTML = '<i class="fas fa-expand"></i>';
  }
  setTimeout(() => fitAddon.fit(), 150);
}

// ── Arama ─────────────────────────────────────────────────────────────────
let searchOpen = false;

function toggleSearch() {
  searchOpen = !searchOpen;
  const bar = document.getElementById('search-bar');
  const btn = document.getElementById('btnSearch');
  bar.classList.toggle('open', searchOpen);
  btn.classList.toggle('active', searchOpen);
  if (searchOpen) {
    setTimeout(() => document.getElementById('search-input').focus(), 50);
  } else {
    searchAddon.clearDecorations();
    document.getElementById('search-count').textContent = '';
    term.focus();
  }
  fitAddon.fit();
}

function doSearch() {
  const q = document.getElementById('search-input').value;
  if (!q) { searchAddon.clearDecorations(); document.getElementById('search-count').textContent = ''; return; }
  const found = searchAddon.findNext(q, { incremental: true, regex: false, caseSensitive: false });
  document.getElementById('search-count').textContent = found ? '' : 'Bulunamadı';
}

function searchNext() {
  const q = document.getElementById('search-input').value;
  if (q) searchAddon.findNext(q, { caseSensitive: false });
}

function searchPrev() {
  const q = document.getElementById('search-input').value;
  if (q) searchAddon.findPrevious(q, { caseSensitive: false });
}

function searchKeydown(e) {
  if (e.key === 'Enter')  { e.shiftKey ? searchPrev() : searchNext(); }
  if (e.key === 'Escape') { toggleSearch(); }
}

// ── Klavye kısayolları ────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); toggleSearch(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'l') { e.preventDefault(); clearTerminal(); }
  if (e.key === 'F11') { e.preventDefault(); toggleFullscreen(); }
});

document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('btnFullscreen');
  btn.innerHTML = document.fullscreenElement
    ? '<i class="fas fa-compress"></i>'
    : '<i class="fas fa-expand"></i>';
  setTimeout(() => fitAddon.fit(), 100);
});

// ── Toast bildirimi ────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── Login overlay ─────────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('login-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('inp-user').focus(), 100);
}
function hideLogin() { document.getElementById('login-overlay').style.display = 'none'; }
function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block';
}
function doLogin() {
  const u = document.getElementById('inp-user').value.trim();
  const p = document.getElementById('inp-pass').value;
  if (!u || !p) { showLoginError('Kullanıcı adı ve parola gerekli'); return; }
  hideLogin(); connect(u, p);
}
document.getElementById('inp-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('inp-user').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inp-pass').focus(); });

// ── Başlangıç ─────────────────────────────────────────────────────────────
if (!machineId) {
  term.writeln('\x1b[31mHata: machineId parametresi eksik\x1b[0m');
  setStatus('error', 'machineId eksik');
} else if (hasCreds) {
  connect();
} else {
  showLogin();
}

window.addEventListener('focus', () => term.focus());
term.focus();
</script>
</body>
</html>
