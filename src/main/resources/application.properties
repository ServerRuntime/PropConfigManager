server.port=5050
server.servlet.context-path=/config-machines
spring.application.name=Config Manager

## UI giriş şifresi (normal kullanıcı)
#app.ui.password=1234
#
## Admin şifresi — servis onay kodlarını görmek için
#app.ui.admin-password=admin1234

# machines.json'un yolu (JAR yanındaki dosya öncelikli; yoksa classpath'teki kullanılır)
app.machines-file=machines.json

# SSH bağlantı zaman aşımı (ms)
app.ssh.timeout=10000

# Properties dosyası uzak sunucuda
app.remote.properties-path=/home/flexcity/java/flexcityconfig/config/default/application-env-shared.properties

# Log seviyesi
logging.level.com.flexcity=INFO
